AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deployer role for the ShipperHQ BigCommerce order change SAM stack (../template.yaml).
  Grants least-privilege access to run `sam deploy` and let CloudFormation create, update
  and delete every resource in that template. Deploy this once per account/region with an
  admin principal:

    aws cloudformation deploy --template-file iam/sam-deployer-role.yaml \
      --stack-name shipperhq-sam-deployer-role --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides TrustedPrincipalArns=arn:aws:iam::<account>:user/<name>

Parameters:
  RoleName:
    Type: String
    Default: shipperhq-sam-deployer
    Description: "Name of the deployer role."
  TrustedPrincipalArns:
    Type: CommaDelimitedList
    Description: "IAM user/role ARNs allowed to assume the deployer role (e.g. arn:aws:iam::<account>:user/<name>)."
  StackNamePattern:
    Type: String
    Default: "*-shipperhq"
    Description: "Stack name (wildcards allowed) of the application stacks this role may manage. Matches samconfig.toml stack_name (e.g. clubpilates-shipperhq)."
  BrandNamePattern:
    Type: String
    Default: "*"
    Description: "BrandName (wildcards allowed) of the application stacks this role may manage. '*' allows every brand."
  FunctionPermissionsBoundaryName:
    Type: String
    Default: shipperhq-lambda-permissions-boundary
    Description: "Name of the permissions boundary policy every function role must carry. Must match PermissionsBoundaryPolicyName in ../template.yaml."

Resources:
  # Caps what the SAM-generated function role can ever do, whatever inline policy is put on it.
  FunctionPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Ref FunctionPermissionsBoundaryName
      Description: "Permissions boundary for the ShipperHQ BigCommerce order change function role."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: FunctionLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${BrandNamePattern}-bigcommerce-order-change-v1"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${BrandNamePattern}-bigcommerce-order-change-v1:*"
          - Sid: OrderSyncSecretRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BrandNamePattern}/shipperhq/bigcommerce-order-sync-*"

  SamDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: "Runs sam deploy for the ShipperHQ BigCommerce order change stack and manages its resources."
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTrustedPrincipals
            Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArns
            Action: sts:AssumeRole
          # Lets the role also be used as a CloudFormation service role (sam deploy --role-arn).
          - Sid: AllowCloudFormationService
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sam-deployer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ---------------- CloudFormation ----------------
              - Sid: CloudFormationReadAndValidate
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:DescribeStacks
                  - cloudformation:ListExports
                Resource: "*"
              - Sid: CloudFormationManageStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetStackPolicy
                  - cloudformation:SetStackPolicy
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:CancelUpdateStack
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:RollbackStack
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackNamePattern}/*"
                  # Stack SAM CLI creates for its artifact bucket (resolve_s3 = true).
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
              - Sid: CloudFormationSamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"

              # ---------------- S3 (SAM managed artifact bucket) ----------------
              - Sid: SamArtifactBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*"
              - Sid: SamArtifactObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*"

              # ---------------- Lambda ----------------
              - Sid: LambdaFunction
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:ListVersionsByFunction
                  - lambda:GetRuntimeManagementConfig
                  - lambda:PutRuntimeManagementConfig
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                  - lambda:PutFunctionRecursionConfig
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${BrandNamePattern}-bigcommerce-order-change-v1"

              # ---------------- IAM (function role SAM generates) ----------------
              # SAM names it <stack-name>-BigCommerceOrderChangeFunctio-<suffix>.
              - Sid: FunctionRoleManage
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackNamePattern}-*"
              # Roles can only be created, given policies or have their boundary set while
              # carrying FunctionPermissionsBoundary, so inline policies can't escalate privileges.
              - Sid: FunctionRoleRequireBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackNamePattern}-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref FunctionPermissionsBoundary
              - Sid: FunctionRoleAttachBasicExecutionOnly
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackNamePattern}-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
                  StringEquals:
                    iam:PermissionsBoundary: !Ref FunctionPermissionsBoundary
              - Sid: FunctionRolePassToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackNamePattern}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

              # ---------------- Secrets Manager ----------------
              - Sid: OrderSyncSecret
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:PutResourcePolicy
                  - secretsmanager:DeleteResourcePolicy
                  - secretsmanager:ValidateResourcePolicy
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BrandNamePattern}/shipperhq/bigcommerce-order-sync-*"

              # ---------------- EventBridge ----------------
              # Rules on a partner bus have ARN rule/<bus-name>/<rule-name>; the bus name contains slashes.
              - Sid: OrderChangeRule
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:EnableRule
                  - events:DisableRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:ListTagsForResource
                  - events:TagResource
                  - events:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*/${BrandNamePattern}-bigcommerce-order-change-all"
              - Sid: EventBusRead
                Effect: Allow
                Action:
                  - events:DescribeEventBus
                  - events:ListRules
                Resource: "*"

Outputs:
  SamDeployerRoleArn:
    Description: "Assume this role (or pass it to sam deploy --role-arn) to deploy the order change stack."
    Value: !GetAtt SamDeployerRole.Arn
  FunctionPermissionsBoundaryArn:
    Description: "Permissions boundary the order change function role must carry."
    Value: !Ref FunctionPermissionsBoundary
